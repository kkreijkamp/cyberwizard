<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberWizard</title>
  </head>
  <body>
    <header id="app-header">
      <span class="logo">🧙 CyberWizard</span>
      <span class="tagline">M3 · save/load, autosave, share via URL</span>
      <span class="header-actions">
        <button id="btn-save" title="Download graph as JSON">Save</button>
        <button id="btn-load" title="Load graph from a JSON file">Load</button>
        <button id="btn-share" title="Copy a shareable URL">Share</button>
        <button id="btn-new" title="Clear the graph">New</button>
      </span>
    </header>
    <div id="app-body">
      <aside id="palette"></aside>
      <main id="graph-host">
        <canvas id="graph"></canvas>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
